name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse bundled scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem knowledge-base-manager/scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Resolve-root tests
        shell: pwsh
        run: ./tests/test-kb-resolve-root.ps1
      - name: Audit tests
        shell: pwsh
        run: ./tests/test-kb-audit.ps1
      - name: Backup and restore tests
        shell: pwsh
        run: ./tests/test-kb-backup.ps1
